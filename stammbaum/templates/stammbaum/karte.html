{% extends "stammbaum/base.html" %}
{% block title %}Herkunftskarte{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
#map { height: 70vh; border-radius: 8px; }
#geocode-progress { display: none; }
</style>
{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h1><i class="bi bi-map me-2"></i>Herkunftskarte</h1>
    <div class="d-flex align-items-center gap-2">
        <span id="geocode-progress" class="text-muted small">
            <span class="spinner-border spinner-border-sm me-1"></span>
            <span id="geocode-status">Koordinaten werden geladen…</span>
        </span>
        <span id="marker-count" class="badge bg-secondary"></span>
    </div>
</div>

<div class="card p-0 mb-3">
    <div id="map"></div>
</div>

<div class="row g-2 text-center small text-muted align-items-center">
    <div class="col-auto"><span class="badge" style="background:#2ecc71">Geburtsort</span></div>
    <div class="col-auto"><span class="badge" style="background:#e74c3c">Sterbeort</span></div>
    <div class="col-auto d-flex align-items-center gap-1">
        <svg width="14" height="14" viewBox="0 0 16 16" style="flex-shrink:0">
            <defs>
                <clipPath id="leg-l"><rect x="0" y="0" width="8" height="16"/></clipPath>
                <clipPath id="leg-r"><rect x="8" y="0" width="8" height="16"/></clipPath>
            </defs>
            <circle cx="8" cy="8" r="6" fill="#2ecc71" clip-path="url(#leg-l)"/>
            <circle cx="8" cy="8" r="6" fill="#e74c3c" clip-path="url(#leg-r)"/>
            <circle cx="8" cy="8" r="6" fill="none" stroke="#888" stroke-width="1.5"/>
        </svg>
        <span>Geburts- &amp; Sterbeort</span>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([51.5, 10.0], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap-Mitwirkende'
}).addTo(map);

function makeIcon(typ) {
    if (typ === 'both') {
        return L.divIcon({
            html: `<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <clipPath id="kl"><rect x="0" y="0" width="8" height="16"/></clipPath>
                    <clipPath id="kr"><rect x="8" y="0" width="8" height="16"/></clipPath>
                </defs>
                <circle cx="8" cy="8" r="6" fill="#2ecc71" clip-path="url(#kl)"/>
                <circle cx="8" cy="8" r="6" fill="#e74c3c" clip-path="url(#kr)"/>
                <circle cx="8" cy="8" r="6" fill="none" stroke="white" stroke-width="2"/>
            </svg>`,
            className: '', iconSize: [16, 16], iconAnchor: [8, 8]
        });
    }
    const color = typ === 'geburt' ? '#2ecc71' : '#e74c3c';
    return L.divIcon({
        html: `<div style="width:12px;height:12px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>`,
        className: '', iconSize: [12, 12], iconAnchor: [6, 6]
    });
}

let markerCount = 0;
const markerCountEl = document.getElementById('marker-count');
const progressEl = document.getElementById('geocode-progress');
const statusEl = document.getElementById('geocode-status');

function addMarkers(data) {
    const bounds = [];
    data.forEach(item => {
        if (item.lat && item.lon) {
            let popupHtml;
            if (item.typ === 'both') {
                const gebNames = (item.personen_geburt || []).map(p =>
                    `<a href="/personen/${p.id}/">${p.name}</a>`).join('<br>');
                const todNames = (item.personen_tod || []).map(p =>
                    `<a href="/personen/${p.id}/">${p.name}</a>`).join('<br>');
                popupHtml = `<strong>${item.ort}</strong>`
                    + `<br><span style="color:#2ecc71">●</span> <em>Geboren:</em><br>${gebNames}`
                    + `<br><span style="color:#e74c3c">●</span> <em>Gestorben:</em><br>${todNames}`;
            } else {
                const names = (item.personen || []).map(p =>
                    `<a href="/personen/${p.id}/">${p.name}</a>`).join('<br>');
                popupHtml = `<strong>${item.ort}</strong><br>${names}`;
            }
            L.marker([item.lat, item.lon], { icon: makeIcon(item.typ) })
                .bindPopup(popupHtml)
                .addTo(map);
            bounds.push([item.lat, item.lon]);
            markerCount++;
        }
    });
    markerCountEl.textContent = `${markerCount} Orte`;
    if (bounds.length > 0) map.fitBounds(bounds, { padding: [30, 30] });
}

async function geocodeMissing(missing) {
    if (!missing.length) { progressEl.style.display = 'none'; return; }
    progressEl.style.display = 'inline-flex';
    let done = 0;
    const newlyGeocoded = [];
    for (const ort of missing) {
        statusEl.textContent = `Geocodierung ${done + 1}/${missing.length}: ${ort}`;
        try {
            const r = await fetch(`/api/geocode/${encodeURIComponent(ort)}/`);
            const d = await r.json();
            if (d.lat && d.lon) {
                newlyGeocoded.push({ ort, lat: d.lat, lon: d.lon });
            }
        } catch (e) {}
        done++;
        await new Promise(r => setTimeout(r, 1200));
    }
    // Add newly geocoded markers
    if (newlyGeocoded.length) {
        const resp = await fetch('/api/karte/');
        const freshData = await resp.json();
        const newItems = freshData.filter(d =>
            d.lat && newlyGeocoded.some(n => n.ort === d.ort)
        );
        addMarkers(newItems);
    }
    statusEl.textContent = `${done} Orte geocodiert`;
    setTimeout(() => { progressEl.style.display = 'none'; }, 2000);
}

fetch('/api/karte/')
    .then(r => r.json())
    .then(data => {
        addMarkers(data.filter(d => d.geocodiert));
        const missing = [...new Set(data.filter(d => !d.geocodiert).map(d => d.ort))];
        if (missing.length) geocodeMissing(missing);
        else progressEl.style.display = 'none';
    });
</script>
{% endblock %}

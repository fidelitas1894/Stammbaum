{% extends "stammbaum/base.html" %}
{% block title %}Herkunftskarte{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
#map { height: 70vh; border-radius: 8px; }
.legend { background: white; padding: 10px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
</style>
{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1><i class="bi bi-map me-2"></i>Herkunftskarte</h1>
    {% if user.is_authenticated %}
    <button id="btnGeocode" class="btn btn-outline-primary btn-sm">
        <i class="bi bi-geo-alt me-1"></i>Orte geocodieren
    </button>
    {% endif %}
</div>

<div class="card p-0 mb-3">
    <div id="map"></div>
</div>

<div class="row g-2 text-center small text-muted">
    <div class="col-auto"><span class="badge" style="background:#2ecc71">Geburtsort</span></div>
    <div class="col-auto"><span class="badge" style="background:#e74c3c">Sterbeort</span></div>
</div>
{% endblock %}
{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([51.5, 10.0], 6);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap-Mitwirkende'
}).addTo(map);

function makeIcon(color) {
    return L.divIcon({
        html: `<div style="width:12px;height:12px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>`,
        className: '', iconSize: [12,12], iconAnchor: [6,6]
    });
}

fetch('/api/karte/')
    .then(r => r.json())
    .then(data => {
        const bounds = [];
        data.forEach(item => {
            if (item.lat && item.lon) {
                const color = item.typ === 'geburt' ? '#2ecc71' : '#e74c3c';
                const names = item.personen.map(p =>
                    `<a href="/personen/${p.id}/">${p.name}</a>`
                ).join('<br>');
                L.marker([item.lat, item.lon], { icon: makeIcon(color) })
                    .bindPopup(`<strong>${item.ort}</strong><br>${names}`)
                    .addTo(map);
                bounds.push([item.lat, item.lon]);
            }
        });
        if (bounds.length > 0) map.fitBounds(bounds, { padding: [30, 30] });
        document.getElementById('markerCount').textContent = bounds.length;
    });

const btnGeocode = document.getElementById('btnGeocode');
if (btnGeocode) {
    btnGeocode.addEventListener('click', async () => {
        btnGeocode.disabled = true;
        btnGeocode.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Geocodiere…';
        const resp = await fetch('/api/karte/');
        const data = await resp.json();
        const missing = data.filter(d => !d.lat).map(d => d.ort);
        let done = 0;
        for (const ort of missing) {
            await fetch(`/api/geocode/${encodeURIComponent(ort)}/`);
            done++;
            btnGeocode.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span>${done}/${missing.length}`;
            await new Promise(r => setTimeout(r, 1100));
        }
        btnGeocode.innerHTML = '<i class="bi bi-check me-1"></i>Fertig — Seite neu laden';
        btnGeocode.disabled = false;
        setTimeout(() => location.reload(), 1500);
    });
}
</script>
<script>document.getElementById('markerCount') || document.write('<span id="markerCount" style="display:none"></span>')</script>
{% endblock %}

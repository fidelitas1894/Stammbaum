{% extends "stammbaum/base.html" %}
{% block title %}Stammbaum{% endblock %}
{% block extra_css %}
<style>
#stammbaum-container { width: 100%; height: 75vh; background: #fff; border-radius: 8px; overflow: hidden; position: relative; }
.node circle { fill: #fff; stroke-width: 2px; cursor: pointer; }
.node.M circle { stroke: #4a90c4; }
.node.F circle { stroke: #c4607a; }
.node.U circle { stroke: #888; }
.node.focal circle { stroke: #e6a817; stroke-width: 3.5px; fill: #fff8e7; }
.node text { font-size: 12px; font-family: sans-serif; pointer-events: none; }
.node .name { font-weight: 600; }
.node .dates { fill: #888; font-size: 11px; }
.link-elternteil { fill: none; stroke: #ccc; stroke-width: 1.5px; }
.link-ehe { fill: none; stroke: #e6a817; stroke-width: 1.5px; stroke-dasharray: 5,3; }
.node circle:hover { fill: #f5e6c8 !important; }
#tooltip { position: absolute; background: #fff; border: 1px solid #ccc; border-radius: 6px;
           padding: 8px 12px; font-size: 13px; pointer-events: none; display: none; z-index: 10;
           box-shadow: 0 2px 8px rgba(0,0,0,.15); }

/* Live-Suche */
.person-search-wrap { position: relative; min-width: 260px; }
#searchDropdown {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 1000;
    background: #fff; border: 1px solid #ccc; border-top: none;
    border-radius: 0 0 6px 6px; max-height: 260px; overflow-y: auto;
    box-shadow: 0 4px 12px rgba(0,0,0,.12); display: none;
}
#searchDropdown .sd-item {
    padding: 7px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #f0f0f0;
}
#searchDropdown .sd-item:last-child { border-bottom: none; }
#searchDropdown .sd-item:hover, #searchDropdown .sd-item.active { background: #f5e6c8; }
#searchDropdown .sd-item .sd-dates { font-size: 11px; color: #888; margin-left: 6px; }
.btn-modus { min-width: 100px; }
</style>
{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h1 class="mb-0"><i class="bi bi-diagram-3 me-2"></i>Stammbaum</h1>
    <div class="d-flex gap-2 flex-wrap align-items-center">

        <div class="person-search-wrap">
            <input type="text" id="personSearch" class="form-control form-control-sm"
                   placeholder="Person suchen…" autocomplete="off"
                   value="{{ start_person.vollname }}{% if start_person.lebensdaten %} ({{ start_person.lebensdaten }}){% endif %}">
            <div id="searchDropdown"></div>
        </div>
        <input type="hidden" id="personId" value="{{ start_person.pk|default:'' }}">

        <div class="btn-group btn-group-sm" role="group">
            <button class="btn btn-outline-primary btn-modus active" data-modus="nachkommen">
                <i class="bi bi-arrow-down-circle me-1"></i>Nachkommen
            </button>
            <button class="btn btn-outline-primary btn-modus" data-modus="vorfahren">
                <i class="bi bi-arrow-up-circle me-1"></i>Vorfahren
            </button>
            <button class="btn btn-outline-primary btn-modus" data-modus="beides">
                <i class="bi bi-diagram-2 me-1"></i>Beides
            </button>
        </div>

        <select id="tiefeSelect" class="form-select form-select-sm" style="width:140px">
            <option value="3">3 Generationen</option>
            <option value="5" selected>5 Generationen</option>
            <option value="8">8 Generationen</option>
            <option value="99">Alle</option>
        </select>

        <button id="btnLaden" class="btn btn-primary btn-sm"><i class="bi bi-arrow-clockwise me-1"></i>Laden</button>
        <button id="btnReset" class="btn btn-outline-secondary btn-sm"><i class="bi bi-fullscreen me-1"></i>Zentrieren</button>
    </div>
</div>

<div class="card p-0" style="overflow:hidden">
    <div id="stammbaum-container">
        <div id="tooltip"></div>
        <svg id="svg-tree" width="100%" height="100%"></svg>
    </div>
</div>
<div class="text-muted small mt-2 d-flex gap-3 flex-wrap">
    <span><i class="bi bi-info-circle me-1"></i>Maus-Rad = Zoom &middot; Ziehen = Schwenken &middot; Klick = Person</span>
    <span id="legend-beides" style="display:none">
        <span style="display:inline-block;width:20px;border-top:2px solid #ccc;vertical-align:middle"></span> Elternteil &nbsp;
        <span style="display:inline-block;width:20px;border-top:2px dashed #e6a817;vertical-align:middle"></span> Ehepartner &nbsp;
        <span class="badge" style="background:#fff8e7;color:#333;border:2px solid #e6a817">★ Fokus</span>
    </span>
</div>

<script>
const PERSONEN = [
    {% for p in personen %}
    { id: {{ p.pk }}, name: "{{ p.vollname|escapejs }}", dates: "{% if p.lebensdaten %}{{ p.lebensdaten|escapejs }}{% endif %}" }{% if not forloop.last %},{% endif %}
    {% endfor %}
];
</script>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
// ---- Live-Suche ----
const searchInput = document.getElementById('personSearch');
const searchDropdown = document.getElementById('searchDropdown');
const personIdInput = document.getElementById('personId');
let activeSdIdx = -1;

function filterPersonen(query) {
    if (!query) return [];
    const q = query.toLowerCase();
    return PERSONEN.filter(p => p.name.toLowerCase().includes(q)).slice(0, 20);
}

function renderDropdown(items) {
    if (!items.length) { searchDropdown.style.display = 'none'; return; }
    searchDropdown.innerHTML = items.map((p, i) =>
        `<div class="sd-item" data-idx="${i}" data-id="${p.id}">
            ${esc(p.name)}<span class="sd-dates">${esc(p.dates)}</span>
        </div>`
    ).join('');
    searchDropdown.style.display = 'block';
    activeSdIdx = -1;
    searchDropdown.querySelectorAll('.sd-item').forEach(el => {
        el.addEventListener('mousedown', e => { e.preventDefault(); selectItem(el); });
    });
}

function selectItem(el) {
    personIdInput.value = el.dataset.id;
    const item = PERSONEN.find(p => p.id == el.dataset.id);
    if (item) searchInput.value = item.name + (item.dates ? ` (${item.dates})` : '');
    searchDropdown.style.display = 'none';
}

function esc(s) {
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

searchInput.addEventListener('input', () => renderDropdown(filterPersonen(searchInput.value)));

searchInput.addEventListener('keydown', e => {
    const items = searchDropdown.querySelectorAll('.sd-item');
    if (!items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); activeSdIdx = Math.min(activeSdIdx + 1, items.length - 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); activeSdIdx = Math.max(activeSdIdx - 1, 0); }
    else if (e.key === 'Enter') {
        e.preventDefault();
        const active = searchDropdown.querySelector('.sd-item.active');
        if (active) { selectItem(active); loadTree(); }
        return;
    } else if (e.key === 'Escape') { searchDropdown.style.display = 'none'; return; }
    items.forEach((el, i) => el.classList.toggle('active', i === activeSdIdx));
    if (items[activeSdIdx]) items[activeSdIdx].scrollIntoView({ block: 'nearest' });
});

searchInput.addEventListener('blur', () => setTimeout(() => { searchDropdown.style.display = 'none'; }, 150));

// ---- Modus ----
let modus = 'nachkommen';
document.querySelectorAll('.btn-modus').forEach(btn => {
    btn.addEventListener('click', () => {
        modus = btn.dataset.modus;
        document.querySelectorAll('.btn-modus').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    });
});

// ---- D3 Setup ----
let svg, g, zoom, currentSim = null;

function init() {
    svg = d3.select('#svg-tree');
    zoom = d3.zoom().scaleExtent([0.05, 4]).on('zoom', e => g.attr('transform', e.transform));
    svg.call(zoom);
    g = svg.append('g');
    const startId = personIdInput.value;
    if (startId) loadTree();
}

function loadTree() {
    const id = personIdInput.value;
    const tiefe = document.getElementById('tiefeSelect').value;
    if (!id) return;
    if (currentSim) { currentSim.stop(); currentSim = null; }
    fetch(`/api/stammbaum/${id}/?modus=${modus}&tiefe=${tiefe}`)
        .then(r => r.json())
        .then(data => {
            document.getElementById('legend-beides').style.display = modus === 'beides' ? '' : 'none';
            if (data.type === 'graph') {
                renderGraph(data);
            } else if (!data || !data.id) {
                g.selectAll('*').remove();
                g.append('text').attr('x', 20).attr('y', 40)
                    .attr('font-size', '14px').attr('fill', '#888')
                    .text('Keine Daten für diese Person und diesen Modus vorhanden.');
            } else {
                renderTree(data);
            }
        })
        .catch(e => console.error(e));
}

// ---- Tree Renderer (für Nachkommen / Vorfahren) ----
function renderTree(data) {
    g.selectAll('*').remove();
    const container = document.getElementById('stammbaum-container');
    const W = container.clientWidth, H = container.clientHeight;
    const root = d3.hierarchy(data);
    const tree = d3.tree().nodeSize([60, 220]);
    tree(root);

    g.selectAll('.link')
        .data(root.links()).enter().append('path')
        .attr('class', 'link-elternteil')
        .attr('d', d3.linkHorizontal().x(d => d.y).y(d => d.x));

    const node = g.selectAll('.node')
        .data(root.descendants()).enter().append('g')
        .attr('class', d => `node ${d.data.geschlecht || 'U'}`)
        .attr('transform', d => `translate(${d.y},${d.x})`)
        .style('cursor', 'pointer')
        .on('click', (e, d) => { window.location.href = d.data.url; })
        .on('mouseover', showTooltip).on('mousemove', moveTooltip)
        .on('mouseout', hideTooltip);

    node.append('circle').attr('r', 20);
    node.append('text').attr('class', 'name').attr('x', 26).attr('dy', '-0.2em')
        .text(d => { const n = d.data.name || ''; return n.length > 22 ? n.substr(0,20) + '…' : n; });
    node.append('text').attr('class', 'dates').attr('x', 26).attr('dy', '1em')
        .text(d => d.data.lebensdaten || '');
    node.append('text').attr('text-anchor', 'middle').attr('dy', '0.35em').attr('font-size', '14px')
        .text(d => glyph(d.data.geschlecht))
        .style('fill', d => glyphColor(d.data.geschlecht));

    fitView();
}

// ---- Graph Renderer (für Beides) ----
function renderGraph(data) {
    g.selectAll('*').remove();
    const container = document.getElementById('stammbaum-container');
    const W = container.clientWidth, H = container.clientHeight;
    const { nodes, links, focal_id } = data;

    // Compute relative generation (focal = 0, ancestors < 0, descendants > 0)
    const genMap = new Map([[focal_id, 0]]);
    const parOf = new Map(nodes.map(n => [n.id, []]));
    const chiOf = new Map(nodes.map(n => [n.id, []]));
    links.forEach(l => {
        if (l.typ === 'elternteil') {
            parOf.get(l.target)?.push(l.source);
            chiOf.get(l.source)?.push(l.target);
        }
    });
    const bfsQ = [focal_id];
    const bfsVis = new Set([focal_id]);
    while (bfsQ.length) {
        const id = bfsQ.shift();
        const gen = genMap.get(id);
        parOf.get(id)?.forEach(pid => {
            if (!bfsVis.has(pid)) { bfsVis.add(pid); genMap.set(pid, gen - 1); bfsQ.push(pid); }
        });
        chiOf.get(id)?.forEach(cid => {
            if (!bfsVis.has(cid)) { bfsVis.add(cid); genMap.set(cid, gen + 1); bfsQ.push(cid); }
        });
    }
    nodes.forEach(n => { if (!genMap.has(n.id)) genMap.set(n.id, 0); });

    const minGen = Math.min(...genMap.values());
    const maxGen = Math.max(...genMap.values());
    const genSpan = maxGen - minGen || 1;
    const GEN_HEIGHT = 110;

    // Simulation
    const sim = d3.forceSimulation(nodes)
        .force('link', d3.forceLink(links).id(d => d.id).distance(d => d.typ === 'ehe' ? 80 : 70).strength(0.6))
        .force('charge', d3.forceManyBody().strength(-200))
        .force('center', d3.forceCenter(0, 0))
        .force('collision', d3.forceCollide(28))
        .force('y-gen', d3.forceY().y(d => genMap.get(d.id) * GEN_HEIGHT).strength(0.7));
    currentSim = sim;

    const linkSel = g.append('g')
        .selectAll('line').data(links).enter().append('line')
        .attr('class', d => d.typ === 'ehe' ? 'link-ehe' : 'link-elternteil');

    const nodeSel = g.append('g')
        .selectAll('.node').data(nodes).enter().append('g')
        .attr('class', d => `node ${d.geschlecht || 'U'}${d.id === focal_id ? ' focal' : ''}`)
        .style('cursor', 'pointer')
        .call(d3.drag()
            .on('start', (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
            .on('drag', (e, d) => { d.fx = e.x; d.fy = e.y; })
            .on('end', (e, d) => { if (!e.active) sim.alphaTarget(0); }))
        .on('click', (e, d) => { if (!e.defaultPrevented) window.location.href = d.url; })
        .on('mouseover', showTooltip).on('mousemove', moveTooltip).on('mouseout', hideTooltip);

    nodeSel.append('circle').attr('r', d => d.id === focal_id ? 24 : 18);
    nodeSel.append('text').attr('class', 'name').attr('x', d => d.id === focal_id ? 28 : 22).attr('dy', '-0.2em')
        .text(d => { const n = d.name || ''; return n.length > 20 ? n.substr(0,18) + '…' : n; });
    nodeSel.append('text').attr('class', 'dates').attr('x', d => d.id === focal_id ? 28 : 22).attr('dy', '1em')
        .text(d => d.lebensdaten || '');
    nodeSel.append('text').attr('text-anchor', 'middle').attr('dy', '0.35em')
        .attr('font-size', d => d.id === focal_id ? '15px' : '12px')
        .text(d => glyph(d.geschlecht)).style('fill', d => glyphColor(d.geschlecht));

    sim.on('tick', () => {
        linkSel.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
               .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
        nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
    });

    // Wait for sim to settle then fit view
    sim.on('end', fitView);
    setTimeout(fitView, 1500);
}

function fitView() {
    const container = document.getElementById('stammbaum-container');
    const W = container.clientWidth, H = container.clientHeight;
    try {
        const bounds = g.node().getBBox();
        if (!bounds.width || !bounds.height) return;
        const scale = Math.min(0.9, W / (bounds.width + 80), H / (bounds.height + 80));
        const tx = (W - bounds.width * scale) / 2 - bounds.x * scale;
        const ty = (H - bounds.height * scale) / 2 - bounds.y * scale;
        svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
    } catch (e) {}
}

// ---- Tooltip ----
function showTooltip(e, d) {
    const tt = document.getElementById('tooltip');
    const name = d.data ? d.data.name : d.name;
    const ld = d.data ? d.data.lebensdaten : d.lebensdaten;
    tt.innerHTML = `<strong>${name}</strong>${ld ? `<br><span class="text-muted">${ld}</span>` : ''}`;
    tt.style.display = 'block';
    moveTooltip(e);
}
function moveTooltip(e) {
    const tt = document.getElementById('tooltip');
    tt.style.left = (e.offsetX + 12) + 'px';
    tt.style.top = (e.offsetY - 10) + 'px';
}
function hideTooltip() { document.getElementById('tooltip').style.display = 'none'; }

function glyph(g) { return g === 'M' ? '♂' : g === 'F' ? '♀' : '?'; }
function glyphColor(g) { return g === 'M' ? '#4a90c4' : g === 'F' ? '#c4607a' : '#888'; }

document.getElementById('btnLaden').addEventListener('click', loadTree);
document.getElementById('btnReset').addEventListener('click', () => {
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
    setTimeout(fitView, 50);
});

init();
</script>
{% endblock %}
